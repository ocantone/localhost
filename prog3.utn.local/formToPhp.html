<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consulta Cliente - Backend PHP</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; background-color: darkcyan;}
        .card { border: 1px solid #ccc; padding: 1rem; margin-top: 1rem; width: 300px; border-radius: 8px; }
        .error { color: red; }
    </style>
</head>
<body>
    <h2>Buscar Cliente (Backend PHP)</h2>
    <form id="formBusqueda">
        <label for="dni">DNI:</label>
        <input type="text" id="dni"  placeholder="Ej: 12345678">
        <button type="submit">Buscar</button>
    </form>



    <div id="resultado"></div>

  <!--  <script src="appPhp.js">    -->
  <!--  Script interpretado por el motor JS del navegador    -->
    
    <script>  
    document.getElementById('formBusqueda').addEventListener('submit', (event) => {
    event.preventDefault();

    const dni = document.getElementById('dni').value;
    const divResultado = document.getElementById('resultado');

    divResultado.innerHTML = '<p>Cargando...</p>';

    fetch(`buscar.php?dni=${encodeURIComponent(document.getElementById('dni').value)}`)
    //fetch(`buscar.php?dni=${dni}`)
        .then(response => {
            if (!response.ok) {
                throw new Error(`Error HTTP: ${response.status}`);
            }
            return response.json();
        })
        .then(res => {
            if (res.status === 'success') {
                const cliente = res.data;
                divResultado.innerHTML = `
                    <div class="card">
                        <h3>${cliente.nombre}</h3>
                        <p><strong>DNI:</strong> ${cliente.dni}</p>
                        <p><strong>Email:</strong> ${cliente.email}</p>
                    </div>
                `;
            } else {
                divResultado.innerHTML = `<p class="error">${res.message}</p>`;
            }
        })
        .catch(err => {
            console.error('Error:', err);
            divResultado.innerHTML = `<p class="error">Error al consultar datos en PHP.</p>`;
        });
});
    </script>
</body>
</html>
